<!doctype html>
<html lang="en-GB">
  <head>
    <meta charset="UTF-8" />
    <title>Gravity Orbit - Procedural</title>
    <style>
      body {
        margin: 0;
        background: #050505;
        color: #00d4ff;
        font-family: "Courier New", monospace;
        overflow: hidden;
        display: flex;
        flex-direction: column;
        align-items: center;
      }
      canvas {
        background: radial-gradient(circle, #0a0a0a 0%, #000 100%);
        display: block;
        margin-top: 20px;
        border: 2px solid #00d4ff;
      }
      .ui {
        position: absolute;
        top: 20px;
        text-align: center;
        width: 100%;
        pointer-events: none;
      }
      .stats-bar {
        display: flex;
        justify-content: center;
        gap: 50px;
        font-size: 1.2em;
        text-shadow: 0 0 5px #00d4ff;
      }
      #fuel-meter {
        color: #00ff00;
      }
    </style>
  </head>
  <body>
    <div class="ui">
      <h1>PROCEDURAL SECTOR</h1>
      <div class="stats-bar">
        <span>FUEL: <span id="fuel-meter">100</span>%</span>
        <span>LEVEL: <span id="level-count">1</span></span>
      </div>
    </div>

    <canvas id="gameCanvas"></canvas>

    <script>
      const canvas = document.getElementById("gameCanvas");
      const ctx = canvas.getContext("2d");
      const fuelDisplay = document.getElementById("fuel-meter");
      const levelDisplay = document.getElementById("level-count");

      canvas.width = 800;
      canvas.height = 600;

      let player, goal, blackHoles, asteroids, level;
      level = 1;

      const keys = {};
      window.addEventListener("keydown", (e) => (keys[e.code] = true));
      window.addEventListener("keyup", (e) => (keys[e.code] = false));

      function initGame(isNewLevel = false) {
        if (isNewLevel) level++;
        else level = 1;

        levelDisplay.innerText = level;

        player = {
          x: 50,
          y: 300,
          vx: 0,
          vy: 0,
          accel: 0.2,
          friction: 0.98,
          radius: 8,
          fuel: 100,
        };
        goal = { x: 750, y: 300, radius: 20 };

        blackHoles = [];
        asteroids = [];

        // Procedural Generation: Create 1-2 Black Holes
        for (let i = 0; i < Math.min(level, 3); i++) {
          blackHoles.push({
            x: 200 + Math.random() * 400,
            y: 100 + Math.random() * 400,
            mass: 1000 + Math.random() * 1000,
            radius: 25 + Math.random() * 15,
          });
        }

        // Procedural Generation: Create Asteroids based on level
        const obstacleCount = 2 + level;
        for (let i = 0; i < obstacleCount; i++) {
          asteroids.push({
            x: 150 + Math.random() * 500,
            y: Math.random() * canvas.height,
            r: 15 + Math.random() * 30,
            speed: 1 + Math.random() * 3,
            dir: Math.random() > 0.5 ? 1 : -1,
          });
        }
      }

      function update() {
        let thrusting = false;
        if (player.fuel > 0) {
          if (keys["ArrowUp"] || keys["KeyW"]) {
            player.vy -= player.accel;
            thrusting = true;
          }
          if (keys["ArrowDown"] || keys["KeyS"]) {
            player.vy += player.accel;
            thrusting = true;
          }
          if (keys["ArrowLeft"] || keys["KeyA"]) {
            player.vx -= player.accel;
            thrusting = true;
          }
          if (keys["ArrowRight"] || keys["KeyD"]) {
            player.vx += player.accel;
            thrusting = true;
          }
        }

        if (thrusting) {
          player.fuel -= 0.3;
          fuelDisplay.innerText = Math.max(0, Math.floor(player.fuel));
        }

        // Gravity Influence
        blackHoles.forEach((bh) => {
          const dx = bh.x - player.x;
          const dy = bh.y - player.y;
          const dist = Math.sqrt(dx * dx + dy * dy);
          const force = bh.mass / (dist * dist);
          player.vx += (dx / dist) * force;
          player.vy += (dy / dist) * force;
          if (dist < bh.radius) initGame(false); // Reset on suck-in
        });

        player.vx *= player.friction;
        player.vy *= player.friction;
        player.x += player.vx;
        player.y += player.vy;

        // Bounds check
        if (
          player.x < 0 ||
          player.x > canvas.width ||
          player.y < 0 ||
          player.y > canvas.height
        )
          initGame(false);

        // Asteroid logic
        asteroids.forEach((a) => {
          a.y += a.speed * a.dir;
          if (a.y > canvas.height - a.r || a.y < a.r) a.dir *= -1;
          const dist = Math.sqrt((player.x - a.x) ** 2 + (player.y - a.y) ** 2);
          if (dist < player.radius + a.r) initGame(false);
        });

        // Win check
        const distToGoal = Math.sqrt(
          (player.x - goal.x) ** 2 + (player.y - goal.y) ** 2,
        );
        if (distToGoal < goal.radius) {
          initGame(true); // Progress to next level
        }
      }

      function draw() {
        ctx.clearRect(0, 0, canvas.width, canvas.height);

        // Draw Black Holes
        blackHoles.forEach((bh) => {
          let grad = ctx.createRadialGradient(
            bh.x,
            bh.y,
            2,
            bh.x,
            bh.y,
            bh.radius * 2.5,
          );
          grad.addColorStop(0, "#000");
          grad.addColorStop(0.4, "#00d4ff");
          grad.addColorStop(1, "transparent");
          ctx.fillStyle = grad;
          ctx.beginPath();
          ctx.arc(bh.x, bh.y, bh.radius * 2.5, 0, Math.PI * 2);
          ctx.fill();
        });

        // Draw Goal
        ctx.strokeStyle = "#00ff00";
        ctx.shadowBlur = 15;
        ctx.shadowColor = "#00ff00";
        ctx.beginPath();
        ctx.arc(goal.x, goal.y, goal.radius, 0, Math.PI * 2);
        ctx.stroke();
        ctx.shadowBlur = 0;

        // Draw Asteroids
        ctx.fillStyle = "#555";
        asteroids.forEach((a) => {
          ctx.beginPath();
          ctx.arc(a.x, a.y, a.r, 0, Math.PI * 2);
          ctx.fill();
        });

        // Draw Player
        ctx.fillStyle = "#fff";
        ctx.beginPath();
        ctx.arc(player.x, player.y, player.radius, 0, Math.PI * 2);
        ctx.fill();

        update();
        requestAnimationFrame(draw);
      }

      initGame();
      draw();
    </script>
  </body>
</html>
